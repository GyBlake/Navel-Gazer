name: Build desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build unsigned desktop artifacts
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npm run dist:mac -- --${{ matrix.arch }}
          elif [ "${{ matrix.platform }}" = "win" ]; then
            npm run dist:win -- --${{ matrix.arch }}
          else
            npm run dist:linux -- --${{ matrix.arch }}
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: navel-gazer-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

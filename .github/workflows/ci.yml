name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
      - name: Verify module syntax
        run: find src bin tests -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Verify desktop wrapper syntax
        run: node --check desktop/main.cjs
